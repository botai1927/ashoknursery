    <script>
      (function () {
        var ASSERTION_FRAGMENT = 'INTERNAL ASSERTION FAILED: Pending promise was never set';
        function getErrorText(val) {
          if (!val) return '';
          if (typeof val === 'string') return val;
          return val.message || val.stack || String(val) || '';
        }
        function isFirebasePopupAssertion(val) {
          return getErrorText(val).indexOf(ASSERTION_FRAGMENT) !== -1;
        }
        function isViteWebSocketNoise(val) {
          var text = getErrorText(val);
          return (
            text.indexOf('WebSocket closed without opened') !== -1 ||
            text.indexOf('failed to connect to websocket') !== -1 ||
            (text.indexOf('@vite/client') !== -1 && text.indexOf('WebSocket') !== -1)
          );
        }
        window.addEventListener(
          'error',
          function (event) {
            if (
              isFirebasePopupAssertion(event.error) ||
              isFirebasePopupAssertion(event.message) ||
              isViteWebSocketNoise(event.error) ||
              isViteWebSocketNoise(event.message)
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (
              isFirebasePopupAssertion(event.reason) ||
              isViteWebSocketNoise(event.reason)
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
